name: "SIPERMA ERP CI/CD Pipeline"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqa-automated-pipeline:
    name: "SQA Phases 1-6 Automated Pipeline"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, sqlite3, curl, json, mbstring
          coverage: none

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: PHP Lint (Syntax Check)
        run: |
          echo "Verifying PHP syntax across codebase..."
          find src config public tests -type f -name "*.php" -exec php -l {} +

      - name: Initialize SQLite Database & Storage
        run: |
          mkdir -p storage/sessions storage/uploads
          chmod -R 777 storage
          php database/init-db.php

      - name: Run SQA Unit & Business Logic Tests (PHP)
        run: |
          php tests/test-runner.php

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Run Jest White Box Unit Tests with Coverage (Phase 4)
        run: |
          npx jest --coverage --colors

      - name: Reset Database for End-to-End & API Testing
        run: |
          php database/init-db.php

      - name: Start Background Web Server on Port 8080
        run: |
          nohup php -S 0.0.0.0:8080 -t public > /tmp/php-server.log 2>&1 &
          sleep 2
          curl --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/login

      - name: Run REST API Testing via Newman (Phase 5)
        run: |
          npx newman run docs/testing/postman-collection.json --env-var "baseUrl=http://127.0.0.1:8080/api" --reporters cli

      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps chromium

      - name: Verify Web Server Health Before E2E Tests
        run: |
          curl --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/login

      - name: Run Playwright E2E Tests (Phase 6)
        env:
          BASE_URL: "http://127.0.0.1:8080"
        run: |
          npx playwright test docs/testing/playwright-e2e.spec.js

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload PHP Server Log on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: php-server-log
          path: /tmp/php-server.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqa-test-results
          path: tests/test-results.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Coverage Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jest-coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
